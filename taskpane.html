<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email Validator</title>
    
    <!-- Office.js library -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            padding: 15px;
            margin: 0;
            background-color: #ffffff;
        }
        
        .header {
            text-align: center;
            background-color: #0078d4;
            color: white;
            padding: 15px;
            margin: -15px -15px 20px -15px;
            border-bottom: 3px solid #005a9e;
        }
        
        .header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .status-live {
            background-color: #107c10;
            color: white;
        }
        
        section {
            margin-bottom: 20px;
        }
        
        h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
            color: #323130;
        }
        
        p {
            margin: 0 0 15px 0;
            color: #605e5c;
            font-size: 13px;
        }
        
        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 2px;
            width: 100%;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #106ebe;
        }
        
        button:active {
            background-color: #005a9e;
        }
        
        #result {
            white-space: pre-wrap;
            background-color: #f3f2f1;
            padding: 15px;
            border-left: 4px solid #0078d4;
            min-height: 80px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #323130;
            border-radius: 2px;
        }
        
        .error {
            background-color: #fde7e9;
            border-left-color: #d13438;
            color: #a4262c;
        }
        
        .success {
            background-color: #dff6dd;
            border-left-color: #107c10;
        }
        
        .info-box {
            background-color: #fff4ce;
            border-left: 4px solid #ffb900;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>📧 Email Validator<span class="status-badge status-live">● LIVE</span></h2>
    </div>
    
    <div class="info-box">
        💡 <strong>Info:</strong> Invalid emails will show a warning banner at the top of your email.
    </div>
    
    <section>
        <p>✨ <strong>Auto-validation enabled!</strong> Results update automatically as you add or remove recipients.</p>
        <button id="run">Refresh Now</button>
    </section>
    
    <section>
        <h3>Verification Results:</h3>
        <div id="result">Waiting for recipients...</div>
    </section>
    
    <script>
        let checkInterval;
        let lastRecipientCount = -1;
        const NOTIFICATION_KEY = "emailValidatorWarning";
        
        // Initialize Office.js
        Office.onReady(function(info) {
            console.log('Office.js initialized - Auto-validation with notifications enabled');
            
            // Manual refresh button
            document.getElementById("run").addEventListener("click", function() {
                checkRecipients(true);
            });
            
            // Start auto-checking every 2 seconds
            startAutoCheck();
        });

        function startAutoCheck() {
            // Check immediately
            checkRecipients(false);
            
            // Then check every 2 seconds
            checkInterval = setInterval(function() {
                checkRecipients(false);
            }, 2000);
        }

        async function checkRecipients(isManual) {
            const resultDiv = document.getElementById("result");
            
            try {
                // TODO: Replace this with API call later
                // const response = await fetch('https://your-api-url/api/valid-emails');
                // const data = await response.json();
                // const validEmails = data.emails;
                
                // Hardcoded database for now - REPLACE WITH API CALL LATER
                const validEmails = [
                    "alexvasilescu25@gmail.com",
                    "vasilescualex25@gmail.com",
                ];
                
                // Get recipients from "To" field
                Office.context.mailbox.item.to.getAsync(function(result) {
                    if (result.status === Office.AsyncResultStatus.Succeeded) {
                        const recipients = result.value;
                        
                        // Only update if recipient count changed (unless manual refresh)
                        if (recipients.length === lastRecipientCount && !isManual) {
                            return;
                        }
                        lastRecipientCount = recipients.length;
                        
                        let output = "";
                        let invalidEmails = [];
                        
                        if (recipients.length === 0) {
                            output = "⚠️  No recipients entered yet.\n\nPlease add email addresses to the 'To' field.";
                            resultDiv.className = "";
                            
                            // Remove notification if no recipients
                            removeNotification();
                        } else {
                            output = "📋 Live Verification:\n";
                            output += "─────────────────────────────\n\n";
                            
                            recipients.forEach(function(recipient) {
                                const email = recipient.emailAddress.toLowerCase();
                                
                                if (validEmails.includes(email)) {
                                    output += "✅ VERIFIED\n";
                                    output += "   " + email + "\n\n";
                                } else {
                                    output += "❌ NOT VERIFIED\n";
                                    output += "   " + email + "\n\n";
                                    invalidEmails.push(email);
                                }
                            });
                            
                            output += "─────────────────────────────\n";
                            output += "Total recipients: " + recipients.length;
                            
                            const now = new Date();
                            const timeStr = now.toLocaleTimeString();
                            
                            if (invalidEmails.length > 0) {
                                output += "\n\n⚠️  Warning: " + invalidEmails.length + " recipient(s) not verified!";
                                output += "\n\nLast checked: " + timeStr;
                                resultDiv.className = "error";
                                
                                // Show notification banner
                                showNotification(invalidEmails);
                            } else {
                                output += "\n\n✓ All recipients verified!";
                                output += "\n\nLast checked: " + timeStr;
                                resultDiv.className = "success";
                                
                                // Remove notification if all valid
                                removeNotification();
                            }
                        }
                        
                        resultDiv.innerText = output;
                    } else {
                        resultDiv.className = "error";
                        resultDiv.innerText = "❌ Error reading recipients:\n\n" + result.error.message;
                    }
                });
                
            } catch (error) {
                resultDiv.className = "error";
                resultDiv.innerText = "❌ Error:\n\n" + error.message;
            }
        }
        
        function showNotification(invalidEmails) {
            const emailList = invalidEmails.join(", ");
            const message = "⚠️ Unverified recipients: " + emailList;
            
            Office.context.mailbox.item.notificationMessages.replaceAsync(
                NOTIFICATION_KEY,
                {
                    type: "informationalMessage",
                    message: message,
                    icon: "icon1",
                    persistent: false
                },
                function(asyncResult) {
                    if (asyncResult.status === Office.AsyncResultStatus.Failed) {
                        console.error("Failed to update notification: " + asyncResult.error.message);
                    }
                }
            );
        }
        
        function removeNotification() {
            // Remove the notification
            Office.context.mailbox.item.notificationMessages.removeAsync(
                NOTIFICATION_KEY,
                function(asyncResult) {
                    if (asyncResult.status === Office.AsyncResultStatus.Failed) {
                        // Ignore error if notification doesn't exist
                        console.log("Notification already removed or doesn't exist");
                    }
                }
            );
        }
    </script>
</body>
</html>
